<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linko</title>
<!--
  A safety net for GitHub Pages.

  Pages can be told to serve three different things, and only one of them is
  the site we actually built:

    Source = GitHub Actions        → the workflow publishes docs/   ✓
    Source = branch main, /docs    → docs/index.html is the root    ✓
    Source = branch main, / (root) → THIS file is the root          ← you are here

  In the third case Jekyll would otherwise render README.md and you would get
  an unstyled wall of text. Redirect to the real page instead.
-->
<meta http-equiv="refresh" content="0; url=./docs/">
<link rel="canonical" href="./docs/">
<script>location.replace('./docs/' + location.search + location.hash);</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08090d;
       color:#98a3b6;font:16px/1.7 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  a{color:#f6821f}
</style>
</head>
<body>
  <p>Taking you to the <a href="./docs/">linko site</a>…</p>
</body>
</html>
