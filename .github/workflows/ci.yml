name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      # Resolves the module graph and writes go.sum if it is not committed yet.
      - name: Resolve dependencies
        run: go mod tidy

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then
            echo "These files need gofmt -s -w:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Test with race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test ./... -race -count=1

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build every target
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 linux/arm windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            echo "==> $os/$arch"
            GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null .
          done

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check the site's inline scripts and assets
        run: node scripts/check-docs.mjs
