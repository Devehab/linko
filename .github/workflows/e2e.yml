name: E2E (real Cloudflare)

# Drives the complete linko lifecycle against a real Cloudflare account,
# using a throwaway origin served on the runner itself:
#
#   init -> start -> fetch the public URL -> verify the body -> remove
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   CF_API_TOKEN   Cloudflare API token (Zone:DNS:Edit + Account:Tunnel:Edit)
#   E2E_DOMAIN     zone apex, e.g. techkahwa.net
#   E2E_BASE       base subdomain, e.g. linko.techkahwa.net
#
# Never run this from a fork: it would expose the secrets.

on:
  # Pushing anything to the run-e2e branch starts a run. Useful when the
  # Actions API is not reachable and only git is available.
  push:
    branches: [run-e2e]
  workflow_dispatch:
    inputs:
      keep:
        description: 'Leave the hostname published afterwards'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Check the secrets are present
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          E2E_DOMAIN: ${{ secrets.E2E_DOMAIN }}
          E2E_BASE: ${{ secrets.E2E_BASE }}
        run: |
          # Everything this job prints must survive into the published report,
          # so start the report file here rather than in the e2e step.
          {
            echo "run:    ${GITHUB_RUN_ID}"
            echo "commit: ${GITHUB_SHA}"
            echo "date:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "=================== secrets ==================="
            [ -n "$CF_API_TOKEN" ] && echo "CF_API_TOKEN  set (${#CF_API_TOKEN} chars)" || echo "CF_API_TOKEN  MISSING"
            [ -n "$E2E_DOMAIN" ]   && echo "E2E_DOMAIN    ${E2E_DOMAIN}"                || echo "E2E_DOMAIN    MISSING"
            [ -n "$E2E_BASE" ]     && echo "E2E_BASE      ${E2E_BASE}"                  || echo "E2E_BASE      MISSING"
          } | tee /tmp/e2e.txt

          if [ -z "$CF_API_TOKEN" ] || [ -z "$E2E_DOMAIN" ] || [ -z "$E2E_BASE" ]; then
            echo "" | tee -a /tmp/e2e.txt
            echo "Add the missing secrets under Settings -> Secrets and variables -> Actions." | tee -a /tmp/e2e.txt
            exit 1
          fi

      - name: Build linko
        run: |
          go mod tidy
          go build -trimpath -o linko .
          ./linko --version

      - name: Serve a known origin on :3000
        run: |
          mkdir -p /tmp/origin
          echo "linko-e2e-${GITHUB_RUN_ID}-${GITHUB_SHA}" > /tmp/origin/index.html
          cd /tmp/origin && nohup python3 -m http.server 3000 >/tmp/origin.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:3000/ >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://localhost:3000/

      - name: Run the end-to-end cycle
        id: e2e
        env:
          LINKO_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          E2E_DOMAIN: ${{ secrets.E2E_DOMAIN }}
          E2E_BASE: ${{ secrets.E2E_BASE }}
          E2E_NAME: ci-e2e
          E2E_PORT: '3000'
          E2E_KEEP: ${{ inputs.keep && '1' || '0' }}
        run: |
          set +e
          ./scripts/e2e-test.sh 2>&1 | tee -a /tmp/e2e.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish the e2e log to the ci-report branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/pub
          # Start from the existing branch so the verify report is not lost.
          git clone -q --depth 1 --branch ci-report \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pub 2>/dev/null || {
              mkdir -p /tmp/pub && cd /tmp/pub && git init -q -b ci-report
              git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            }
          cd /tmp/pub
          cp /tmp/e2e.txt e2e-report.txt 2>/dev/null || echo "the job produced no output at all" > e2e-report.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "e2e report for ${GITHUB_SHA}" || echo "nothing changed"
          git push -q --force origin HEAD:ci-report
          echo "published"

      - name: Fail the job if the e2e cycle failed
        if: steps.e2e.outputs.status != '0'
        run: exit 1
