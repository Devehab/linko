name: Install test

# Answers one question honestly: does the documented one-liner work on a
# machine where nothing has ever been installed?
#
#   curl -fsSL .../install.sh | bash
#
# It runs against the published release, not the working tree, so it tests
# exactly what a stranger gets. Every job keeps its own transcript, and they
# are collected onto the ci-report branch as install-report.txt.

on:
  push:
    branches: [run-install-test]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # catch a release that silently rots

permissions:
  contents: write

concurrency:
  group: install-test
  cancel-in-progress: true

jobs:
  # ── real GitHub-hosted machines ───────────────────────────────────────────
  #
  # Only "-latest" labels. Pinned images such as macos-13 get retired, and a
  # job asking for a label that no longer exists waits in the queue forever
  # rather than failing.
  hosts:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Install and verify
        id: run
        shell: bash
        run: |
          set +e
          LOG="log-${{ matrix.os }}.txt"
          {
            echo "──────── ${{ matrix.os }} ────────"
            echo "uname: $(uname -sm 2>/dev/null || echo windows)"
            for t in curl tar bash go; do
              printf '  %-5s %s\n' "$t" "$(command -v $t 2>/dev/null || echo '(absent)')"
            done

            echo
            echo "\$ curl -fsSL .../install.sh | bash"
            curl -fsSL https://raw.githubusercontent.com/Devehab/linko/main/install.sh | bash
            rc=$?
            echo "[install exit $rc]"

            export PATH="$HOME/.local/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"

            echo
            echo "\$ command -v linko";  command -v linko;    echo "[exit $?]"
            echo "\$ linko --version";   linko --version;     echo "[exit $?]"
            echo "\$ linko --help";      linko --help  >/dev/null; echo "[exit $?]"
            echo "\$ linko docs";        linko docs    >/dev/null; echo "[exit $?]"
            echo "\$ linko list  (must steer an unconfigured user to init)"
            # Not a pipeline: GitHub runs bash with -o pipefail, so
            # `linko list | grep` would report linko's exit code — which is
            # correctly 1 here — instead of whether the hint was printed.
            linko list > list.out 2>&1
            head -3 list.out
            grep -qi 'linko init' list.out; echo "[exit $?]"
          } > "$LOG" 2>&1
          cat "$LOG"
          grep -qE '^\[.* exit [1-9]|^\[exit [1-9]' "$LOG" && exit 1 || exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ matrix.os }}
          path: log-${{ matrix.os }}.txt
          retention-days: 7

  # ── bare distro images, nothing preinstalled ──────────────────────────────
  containers:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:11
          - ubuntu:24.04
          - ubuntu:22.04
          - alpine:latest
          - fedora:latest
          - rockylinux/rockylinux:9
          - archlinux:latest
          - opensuse/leap:latest
    steps:
      - name: Install and verify
        shell: sh
        run: |
          IMG=$(echo "${{ matrix.image }}" | tr '/:' '--')
          LOG="log-${IMG}.txt"
          {
            echo "──────── ${{ matrix.image }} ────────"
            echo "uname: $(uname -sm)"
            echo "shipped with:"
            for t in sh bash curl tar go; do
              printf '  %-5s %s\n' "$t" "$(command -v $t 2>/dev/null || echo '(absent)')"
            done

            # A fresh desktop install of any of these ships curl, bash and tar.
            # Minimal container images do not, so add exactly those and nothing
            # else — never Go, never a compiler.
            echo
            echo "adding bash/curl/tar/ca-certificates only:"
            if   command -v apk     >/dev/null 2>&1; then apk add --no-cache bash curl tar ca-certificates >/dev/null 2>&1
            elif command -v apt-get >/dev/null 2>&1; then apt-get update -qq >/dev/null 2>&1 && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bash curl tar ca-certificates >/dev/null 2>&1
            elif command -v dnf     >/dev/null 2>&1; then dnf install -y -q bash curl tar ca-certificates >/dev/null 2>&1
            elif command -v pacman  >/dev/null 2>&1; then pacman -Sy --noconfirm --quiet bash curl tar ca-certificates >/dev/null 2>&1
            elif command -v zypper  >/dev/null 2>&1; then zypper -q --non-interactive install bash curl tar ca-certificates >/dev/null 2>&1
            fi
            echo "  go is $(command -v go >/dev/null 2>&1 && echo PRESENT || echo 'still absent — good')"

            echo
            echo "\$ curl -fsSL .../install.sh | bash"
            curl -fsSL https://raw.githubusercontent.com/Devehab/linko/main/install.sh | bash
            echo "[install exit $?]"

            PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
            export PATH

            echo
            echo "\$ command -v linko"; command -v linko;      echo "[exit $?]"
            echo "\$ linko --version";  linko --version;       echo "[exit $?]"
            echo "\$ linko --help";     linko --help >/dev/null; echo "[exit $?]"
            echo "\$ linko docs";       linko docs   >/dev/null; echo "[exit $?]"
            echo "\$ linko list  (must steer an unconfigured user to init)"
            # Not a pipeline: GitHub runs bash with -o pipefail, so
            # `linko list | grep` would report linko's exit code — which is
            # correctly 1 here — instead of whether the hint was printed.
            linko list > list.out 2>&1
            head -3 list.out
            grep -qi 'linko init' list.out; echo "[exit $?]"
          } > "$LOG" 2>&1
          cat "$LOG"
          grep -qE '^\[.* exit [1-9]|^\[exit [1-9]' "$LOG" && exit 1 || exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-${{ strategy.job-index }}
          path: log-*.txt
          retention-days: 7

  # ── collect every transcript into one readable report ─────────────────────
  report:
    needs: [hosts, containers]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: logs
          merge-multiple: true

      - name: Build the report
        env:
          HOSTS: ${{ needs.hosts.result }}
          CONTAINERS: ${{ needs.containers.result }}
        run: |
          {
            echo "install one-liner test"
            echo "commit: ${GITHUB_SHA}"
            echo "date:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "command under test:"
            echo "  curl -fsSL https://raw.githubusercontent.com/Devehab/linko/main/install.sh | bash"
            echo
            echo "hosts:      ${HOSTS}"
            echo "containers: ${CONTAINERS}"
            echo
            echo "════════════════════ per platform ════════════════════"
            for f in logs/log-*.txt; do
              [ -f "$f" ] || continue
              echo
              if grep -qE '^\[.* exit [1-9]|^\[exit [1-9]' "$f"; then
                echo "### FAIL $(head -1 "$f")"
              else
                echo "### PASS $(head -1 "$f")"
              fi
              sed 's/^/    /' "$f"
            done
          } > install-report.txt
          head -40 install-report.txt

      - name: Publish to the ci-report branch
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/pub
          git clone -q --depth 1 --branch ci-report \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pub 2>/dev/null || {
              mkdir -p /tmp/pub && cd /tmp/pub && git init -q -b ci-report
              git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            }
          cp install-report.txt /tmp/pub/
          cd /tmp/pub
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "install report for ${GITHUB_SHA}" || echo "nothing changed"
          git push -q --force origin HEAD:ci-report
