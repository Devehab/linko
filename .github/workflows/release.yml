name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Resolve version
        id: v
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag"           >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"   >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        run: go mod tidy

      - name: Test
        run: go test ./... -count=1

      # Archive names must match install.sh:
      #   linko_<version>_<os>_<arch>.tar.gz   /   .zip on Windows
      - name: Build archives
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 linux/arm windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            echo "==> $os/$arch"
            # CGO_ENABLED=0 is what makes these binaries portable. With cgo on,
            # the linux/amd64 build links against the host's glibc and refuses
            # to start on musl systems such as Alpine.
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/linko${ext}" .
            if [ "$os" = "windows" ]; then
              (cd dist && zip -q "linko_${VERSION}_${os}_${arch}.zip" "linko${ext}" && rm "linko${ext}")
            else
              (cd dist && tar -czf "linko_${VERSION}_${os}_${arch}.tar.gz" linko && rm linko)
            fi
          done
          (cd dist && sha256sum * > "linko_${VERSION}_checksums.txt")
          ls -1 dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: dist/*
